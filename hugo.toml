baseURL = "https://home.wangjianshuo.com/"
title = "王建硕的博客"
hasCJKLanguage = true
relativeURLs = true        # emit page-relative links so the built site works
canonifyURLs = false       # from file://, a subpath, or the custom domain alike
enableRobotsTXT = true
enableEmoji = true
timeZone = "Asia/Shanghai"

[pagination]
  pagerSize = 20


[taxonomies]
  tag = "tags"

[markup.goldmark.renderer]
  unsafe = true          # allow passed-through <video>/<iframe> embeds

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[outputs]
  home = ["HTML", "RSS"]

[params]
  description = "王建硕的中文博客存档"

[[menu.main]]
  identifier = "home"
  name = "首页"
  url = "/"
  weight = 10
