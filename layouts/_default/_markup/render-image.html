{{- $d := .Destination -}}
{{- if hasPrefix $d "/" -}}
  {{- $d = printf "%s%s" (site.Params.imageBaseURL | default "") $d -}}
{{- end -}}
<img src="{{ $d | safeURL }}" loading="{{ cond (eq .Ordinal 0) "eager" "lazy" }}"
  {{- if eq .Ordinal 0 }} fetchpriority="high"{{ end }}
  {{- with .Text }} alt="{{ . }}"{{ end }}
  {{- with .Title }} title="{{ . }}"{{ end }} />
